# Disposable integration database, started and stopped explicitly.
# TEST_DATABASE_URL=postgres://iptv_test@127.0.0.1:15432/iptv_test?sslmode=disable
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iptv_test
      POSTGRES_DB: iptv_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptv_test -d iptv_test"]
      interval: 1s
      timeout: 3s
      retries: 30
