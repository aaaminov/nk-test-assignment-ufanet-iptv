services:
  app:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://iptv_demo:iptv_demo@db:5432/iptv_demo?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iptv_demo
      POSTGRES_PASSWORD: iptv_demo
      POSTGRES_DB: iptv_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "iptv_demo", "-d", "iptv_demo"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
